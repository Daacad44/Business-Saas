services:
  postgres:
    image: postgres:16-alpine
    container_name: daljir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: daljir
      POSTGRES_PASSWORD: daljir
      POSTGRES_DB: daljir
    ports:
      - "5432:5432"
    volumes:
      - daljir_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daljir -d daljir"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: daljir-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - daljir_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  daljir_pg_data:
  daljir_redis_data:
